[package]
name = "falcon-gpu"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Portable GPU compute/render (Vulkan/DX12 on the RTX 5080). Proven in spikes-gpu.
wgpu = "29"
pollster = "0.4"
bytemuck = "1"
anyhow = "1"
falcon-decode = { path = "../falcon-decode" }
# U2: the fused YUV shader folds the exact falcon-color gamut maths into its pass.
falcon-color = { path = "../falcon-color" }

[dev-dependencies]
# Integration tests build the fast-tier pipelines on a real device to validate the WGSL compiles.
wgpu = "29"
pollster = "0.4"
